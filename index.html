<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Mana Crystals: a falling-block fantasy RPG." />
    <title>Mana Crystals</title>
  </head>
  <body>
    <main id="app">
      <header class="hud" aria-label="Hero status">
        <div class="hud-name"><b id="hud-name">Aster</b> <span id="hud-level">Lv 1</span></div>
        <div class="hud-bar">
          <small>HP <span id="hud-hp">40 / 40</span></small>
          <div class="bar"><span id="hud-hp-bar"></span></div>
        </div>
        <div id="hud-mana" aria-label="Elemental mana"></div>
        <div class="hud-stat"><small>Gil</small><b id="hud-gil">25</b></div>
        <div class="hud-stat"><small>XP</small><b id="hud-xp">0 / 30</b></div>
        <div class="hud-stat hud-place"><small>Location</small><b id="hud-place">Mossvale</b></div>
        <button id="menu-button" type="button" aria-haspopup="dialog">Menu (M)</button>
      </header>

      <section id="world-view" class="view" aria-label="World">
        <canvas id="world-canvas" width="640" height="416"></canvas>
        <p id="world-message" class="world-message" role="status" aria-live="polite"></p>
        <p class="muted">Arrows / WASD to walk · walk into anyone to challenge them · M for menu</p>
      </section>

      <section id="battle-view" class="view battle" aria-label="Battle" hidden>
        <div class="battle-board">
          <canvas id="board-canvas" width="300" height="600" aria-label="Board"></canvas>
        </div>
        <div class="battle-side">
          <canvas id="stage-canvas" width="480" height="240" aria-hidden="true"></canvas>
          <div class="panel hero-panel">
            <div class="hp-row">
              <span id="battle-hp-icon"></span>
              <div class="bar"><span id="battle-hp-fill"></span></div>
              <b id="battle-hp-text"></b>
              <canvas id="next-canvas" width="96" height="56" aria-label="Next piece"></canvas>
            </div>
            <div id="battle-mana" aria-label="Elemental mana"></div>
          </div>
          <div class="panel actions-panel" id="actions-panel">
            <div id="spell-list" class="spells"></div>
            <div id="battle-items" class="items"></div>
          </div>
          <div class="controls" aria-label="Touch controls">
            <button type="button" data-battle="left" aria-label="Move left" title="Left arrow">
              ◀
            </button>
            <button type="button" data-battle="rotate" aria-label="Rotate" title="Up arrow">
              ↻
            </button>
            <button type="button" data-battle="right" aria-label="Move right" title="Right arrow">
              ▶
            </button>
            <button type="button" data-battle="softDrop" aria-label="Soft drop" title="Down arrow">
              ▽
            </button>
            <button type="button" data-battle="hardDrop" aria-label="Hard drop" title="Space">
              ▼
            </button>
            <button type="button" id="pause-button" aria-label="Pause" title="P">❚❚</button>
          </div>
        </div>
      </section>

      <div id="touch-pad" class="touch-pad" aria-label="Touch movement">
        <button type="button" data-dir="up" aria-label="Walk up">▲</button>
        <button type="button" data-dir="left" aria-label="Walk left">◀</button>
        <button type="button" data-dir="down" aria-label="Walk down">▼</button>
        <button type="button" data-dir="right" aria-label="Walk right">▶</button>
      </div>

      <dialog id="dialog" aria-labelledby="dialog-title">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
        <div id="dialog-actions" class="actions"></div>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
